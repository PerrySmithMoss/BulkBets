services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bulk_bets
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - db-data-v18:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bulk_bets"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: ./server
    command: ["/app/migrate", "-action", "up"]
    env_file:
      - ./server/.env.example
      - path: ./server/.env
        required: false
    environment:
      DB_ADDR: postgres://admin:adminpassword@db:5432/bulk_bets?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./server
    env_file:
      - ./server/.env.example
      - path: ./server/.env
        required: false
    environment:
      # server/.env uses localhost for Go on the host; containers use Docker DNS.
      DB_ADDR: postgres://admin:adminpassword@db:5432/bulk_bets?sslmode=disable
      DB_HOST: db
      DB_PORT: "5432"
      APP_PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data-v18:
