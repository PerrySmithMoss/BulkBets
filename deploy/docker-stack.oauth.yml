version: "3.9"
services:
  api:
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/bulkbets_google_client_secret
    secrets:
      - bulkbets_google_client_secret
secrets:
  bulkbets_google_client_secret:
    external: true
