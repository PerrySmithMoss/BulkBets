# Used on its own; never reads or deletes the development database volume.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bulk_bets
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: e2e-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bulk_bets"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: ./server
    command: ["/app/migrate", "-action", "up"]
    environment:
      DB_ADDR: postgres://admin:e2e-password@db:5432/bulk_bets?sslmode=disable
      ADMIN_USER_PASSWORD: e2e-password
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./server
    command: ["/app/migrate", "-action", "seed"]
    environment:
      DB_ADDR: postgres://admin:e2e-password@db:5432/bulk_bets?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:18025:8025"

  api:
    build: ./server
    environment:
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: noreply@bulkbets.test
      DB_HOST: db
      DB_PASSWORD: e2e-password
      APP_CLIENT_URL: http://127.0.0.1:3100
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3100
      ACCESS_TOKEN_SECRET: e2e-access-secret
      REFRESH_TOKEN_SECRET: e2e-refresh-secret
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 30
