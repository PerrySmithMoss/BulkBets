# Used on its own; never reads or deletes the development database volume.
services:
  db:
    image: ${BULKBETS_TEST_POSTGRES_IMAGE:-postgres:18.6}
    environment:
      # The application database must be created by the provisioning command.
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: e2e-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  provision-tests:
    build:
      context: ./server
      target: build
    command: ["go", "test", "-race", "./internal/provision", "-run", "TestIntegration", "-v"]
    environment:
      BULKBETS_PROVISION_TEST_DSN: postgres://admin:e2e-password@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  provision:
    build: ./server
    command: ["/app/migrate", "-action", "provision"]
    environment:
      DB_HOST: db
      DB_USER: bulkbets
      DB_NAME: bulk_bets
      DB_PASSWORD: e2e-password-for-app
      DB_ADMIN_USER: admin
      DB_ADMIN_PASSWORD: e2e-password
    depends_on:
      provision-tests:
        condition: service_completed_successfully

  migrate:
    build: ./server
    command: ["/app/migrate", "-action", "up"]
    environment:
      DB_ADDR: postgres://bulkbets:e2e-password-for-app@db:5432/bulk_bets?sslmode=disable
      ADMIN_USER_PASSWORD: e2e-password
    depends_on:
      provision:
        condition: service_completed_successfully

  seed:
    build: ./server
    command: ["/app/migrate", "-action", "seed"]
    environment:
      DB_ADDR: postgres://bulkbets:e2e-password-for-app@db:5432/bulk_bets?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  runtime-role:
    image: ${BULKBETS_TEST_POSTGRES_IMAGE:-postgres:18.6}
    environment:
      PGPASSWORD: e2e-password
    command: [psql, -h, db, -U, admin, -d, bulk_bets, -v, ON_ERROR_STOP=1, -c, "CREATE ROLE bulkbets_runtime LOGIN PASSWORD 'e2e-runtime-password';"]
    depends_on:
      seed:
        condition: service_completed_successfully

  runtime-grants:
    build: ./server
    command: ["/app/migrate", "-action", "runtime-grants"]
    environment:
      DB_ADDR: postgres://bulkbets:e2e-password-for-app@db:5432/bulk_bets?sslmode=disable
    depends_on:
      runtime-role:
        condition: service_completed_successfully

  store-tests:
    build:
      context: ./server
      target: build
    command: ["go", "test", "-race", "./internal/store", "-run", "TestIntegration", "-v"]
    environment:
      BULKBETS_TEST_DSN: postgres://bulkbets:e2e-password-for-app@db:5432/bulk_bets?sslmode=disable
    depends_on:
      runtime-grants:
        condition: service_completed_successfully

  api:
    build: ./server
    environment:
      # Deliberately disable outbound email in the isolated test stack.
      SMTP_ADDR: ""
      SMTP_FROM: ""
      DB_HOST: db
      DB_USER: bulkbets_runtime
      DB_PASSWORD: e2e-runtime-password
      APP_CLIENT_URL: http://127.0.0.1:3100
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3100,http://127.0.0.1:3101
      ACCESS_TOKEN_SECRET: e2e-access-secret
      REFRESH_TOKEN_SECRET: e2e-refresh-secret
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      store-tests:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 30
