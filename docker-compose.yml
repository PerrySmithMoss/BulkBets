services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bulk_bets
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - db-data-v18:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bulk_bets"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: ./server
    command: ["/app/migrate", "-action", "up"]
    environment:
      DB_ADDR: postgres://admin:adminpassword@db:5432/bulk_bets?sslmode=disable
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-local-development-password}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./server
    environment:
      DB_HOST: db
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_CLIENT_URL: ${APP_CLIENT_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local-access-secret-change-for-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-local-refresh-secret-change-for-production}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data-v18:
