version: "3.8"

services:
  db:
    image: postgres:16.3
    container_name: bulk_bets_postgres_db
    environment:
      POSTGRES_DB: bulk_bets
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    networks:
      - server
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/scripts:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"

volumes:
  db-data:

networks:
  server:
    driver: bridge
