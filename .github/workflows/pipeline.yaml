name: BulkBets Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a production migration or deploy when another commit arrives.
concurrency:
  group: bulkbets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install dependencies
        run: npm --prefix web ci && npm --prefix mobile ci
      - name: Check dependency vulnerabilities
        run: |
          npm --prefix web audit --omit=dev --audit-level=high
          npm --prefix mobile audit --omit=dev --audit-level=high
          cd server
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Scan git history for secrets
        run: |
          git fetch --unshallow
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Check Go API
        working-directory: server
        run: go test ./... && go vet ./...
      - name: Check GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/pipeline.yaml
      - name: Check web app
        run: npm --prefix web run lint && npm --prefix web run typecheck && npm --prefix web test -- --runInBand
      - name: Type-check Node tooling
        run: npm --prefix web run typecheck:tools
      - name: Check mobile app and native exports
        env:
          EXPO_PUBLIC_API_URL: https://bulkbets-api.perrysmithmoss.com/api/v1
        run: npm --prefix mobile run lint && npm --prefix mobile run typecheck && npm --prefix mobile run export:native
      - name: Check deployment shell syntax
        run: sh -n deploy/migrate.sh deploy/backup.sh deploy/rollout.sh deploy/host-maintenance.sh deploy/restricted/install.sh
      - name: Check restricted release boundary
        run: python3 -B -m unittest discover -s deploy/restricted -p 'test_*.py'
      - name: Check deployment ordering and failure handling
        run: node --test deploy/tests/rollout.test.mts

  e2e:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BULKBETS_TEST_POSTGRES_IMAGE: postgres:17.11-bookworm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - name: Install dependencies
        run: npm --prefix web ci && npm --prefix mobile ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright browser and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Run browser and storage integration tests
        run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: |
            web/test-results
            web/playwright-report

  build-and-push-image:
    # Every validated master push is a release, including fixes that unblock an
    # earlier failed deployment without changing the backend again.
    needs: [e2e]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/perrysmithmoss/bulkbets
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - name: Build and push Go API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan release image before deployment
        run: |
          docker pull "ghcr.io/perrysmithmoss/bulkbets:${{ github.sha }}"
          docker save "ghcr.io/perrysmithmoss/bulkbets:${{ github.sha }}" -o "$RUNNER_TEMP/api.tar"
          docker run --rm -v "$RUNNER_TEMP/api.tar:/api.tar:ro" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --input /api.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1

  deploy:
    needs: [build-and-push-image]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      packages: read
    steps:
      - name: Configure VPS SSH connection
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          BULKBETS_RELEASE_KEY: ${{ secrets.BULKBETS_RELEASE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -eu
          : "${VPS_IP:?Configure the VPS_IP repository secret}"
          : "${BULKBETS_RELEASE_KEY:?Configure the BULKBETS_RELEASE_KEY production environment secret}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$BULKBETS_RELEASE_KEY" > "$RUNNER_TEMP/bulkbets-deploy-key"
          : "${VPS_KNOWN_HOSTS:?Configure verified VPS_KNOWN_HOSTS; host-key discovery is not trusted}"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/bulkbets-known-hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host bulkbets-vps
            HostName $VPS_IP
            User bulkbets-release
            Port $VPS_SSH_PORT
            IdentityFile $RUNNER_TEMP/bulkbets-deploy-key
            UserKnownHostsFile $RUNNER_TEMP/bulkbets-known-hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 30
          EOF
      - name: Deploy through the restricted host broker
        env:
          GIT_COMMIT_HASH: ${{ github.sha }}
          RELEASE_DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Expand the immutable release identifiers on the runner; the broker validates them.
          # shellcheck disable=SC2029
          node -e 'process.stdout.write(JSON.stringify({username:process.env.GHCR_USERNAME,token:process.env.GHCR_TOKEN})+"\n")' |
            ssh bulkbets-vps "release $GIT_COMMIT_HASH $RELEASE_DIGEST"
      - name: Clean up runner credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/bulkbets-deploy-key" "$RUNNER_TEMP/bulkbets-known-hosts" "$HOME/.ssh/config"

  promote-web:
    # Vercel tracks this branch, so frontend production follows the tested API.
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Promote the validated release to Vercel
        run: git push origin "${GITHUB_SHA}:refs/heads/production"
